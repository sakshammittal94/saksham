
<!DOCTYPE html>
<html>
<head>
    <title>My Table</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <h2>Student Details</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>

        <tr>
            <td>saksham</td>
            <td>20</td>
            <td>Jaipur</td>
        </tr>

        <tr>
            <td>ankit</td>
            <td>21</td>
            <td>Delhi</td>
        </tr>

        <tr>
            <td>mohit</td>
            <td>19</td>
            <td>Mumbai</td>
        </tr>
        
    </table>

</body>
</html>
